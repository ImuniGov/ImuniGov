<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura final esperada do ImuniGuia</title>
  <desc id="desc">Usuários acessam uma SPA que chama uma API modular. A API aplica autenticação, autorização e regras de negócio, persiste dados no PostgreSQL, arquivos em storage privado e envia tarefas para Redis e worker de OCR e notificações. Auditoria registra ações importantes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#526579"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182433}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#526579}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#394b5f}.tiny{font-size:12px;fill:#526579}.box{stroke-width:2;rx:16}.line{stroke:#526579;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#f5f8fc"/>
  <text x="60" y="62" class="title">ImuniGuia · arquitetura final esperada</text>
  <text x="60" y="91" class="subtitle">Monólito modular com API REST, banco relacional e processamento assíncrono</text>

  <rect x="60" y="180" width="190" height="300" class="box" fill="#ffffff" stroke="#8aa0b8"/>
  <text x="155" y="218" text-anchor="middle" class="label">Perfis</text>
  <rect x="83" y="244" width="144" height="48" rx="10" fill="#edf4ff" stroke="#9db8df"/>
  <text x="155" y="274" text-anchor="middle" class="small">Família</text>
  <rect x="83" y="310" width="144" height="58" rx="10" fill="#edf4ff" stroke="#9db8df"/>
  <text x="155" y="335" text-anchor="middle" class="small">Enfermagem</text><text x="155" y="354" text-anchor="middle" class="tiny">UBS</text>
  <rect x="83" y="386" width="144" height="48" rx="10" fill="#edf4ff" stroke="#9db8df"/>
  <text x="155" y="416" text-anchor="middle" class="small">ACS</text>

  <rect x="310" y="230" width="210" height="210" class="box" fill="#e8f1ff" stroke="#5082c0"/>
  <text x="415" y="274" text-anchor="middle" class="label">Interface web</text>
  <text x="415" y="307" text-anchor="middle" class="small">React + TypeScript</text>
  <text x="415" y="334" text-anchor="middle" class="small">SPA responsiva</text>
  <text x="415" y="374" text-anchor="middle" class="tiny">Fluxos por perfil</text>
  <text x="415" y="397" text-anchor="middle" class="tiny">UI atual é temporária</text>

  <rect x="580" y="190" width="440" height="330" class="box" fill="#ffffff" stroke="#3e73a9"/>
  <text x="800" y="229" text-anchor="middle" class="label">API REST · FastAPI</text>
  <text x="800" y="254" text-anchor="middle" class="tiny">OpenAPI · Pydantic · SQLAlchemy</text>
  <rect x="610" y="280" width="180" height="78" rx="11" fill="#e9f7f1" stroke="#68a88c"/>
  <text x="700" y="311" text-anchor="middle" class="small">Identidade</text><text x="700" y="335" text-anchor="middle" class="tiny">login · perfis · acesso</text>
  <rect x="810" y="280" width="180" height="78" rx="11" fill="#e9f7f1" stroke="#68a88c"/>
  <text x="900" y="311" text-anchor="middle" class="small">Família</text><text x="900" y="335" text-anchor="middle" class="tiny">usuários · dependentes</text>
  <rect x="610" y="378" width="180" height="78" rx="11" fill="#fff4df" stroke="#d6aa58"/>
  <text x="700" y="409" text-anchor="middle" class="small">Documentos</text><text x="700" y="433" text-anchor="middle" class="tiny">upload · OCR · revisão</text>
  <rect x="810" y="378" width="180" height="78" rx="11" fill="#fff4df" stroke="#d6aa58"/>
  <text x="900" y="409" text-anchor="middle" class="small">Cuidado vacinal</text><text x="900" y="433" text-anchor="middle" class="tiny">regras · pendências</text>
  <text x="800" y="490" text-anchor="middle" class="tiny">Orientação UBS · busca ativa ACS · notificações · auditoria</text>

  <rect x="1090" y="160" width="285" height="135" class="box" fill="#e8f7fb" stroke="#4d9caf"/>
  <text x="1232" y="198" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1232" y="227" text-anchor="middle" class="small">dados relacionais e transações</text>
  <text x="1232" y="255" text-anchor="middle" class="tiny">migrações com Alembic</text>

  <rect x="1090" y="345" width="285" height="130" class="box" fill="#f1edff" stroke="#8974bd"/>
  <text x="1232" y="384" text-anchor="middle" class="label">Storage privado</text>
  <text x="1232" y="413" text-anchor="middle" class="small">S3 / MinIO</text>
  <text x="1232" y="441" text-anchor="middle" class="tiny">imagens e PDFs originais</text>

  <rect x="580" y="610" width="250" height="125" class="box" fill="#fff0e8" stroke="#cc8352"/>
  <text x="705" y="649" text-anchor="middle" class="label">Fila · Redis</text>
  <text x="705" y="679" text-anchor="middle" class="small">tarefas assíncronas</text>
  <text x="705" y="706" text-anchor="middle" class="tiny">retentativas idempotentes</text>

  <rect x="895" y="590" width="290" height="165" class="box" fill="#fff7e9" stroke="#cc9b43"/>
  <text x="1040" y="628" text-anchor="middle" class="label">Worker · Celery</text>
  <text x="1040" y="659" text-anchor="middle" class="small">OCR por adaptador</text>
  <text x="1040" y="687" text-anchor="middle" class="small">extrações a conferir</text>
  <text x="1040" y="715" text-anchor="middle" class="tiny">notificações fora da requisição</text>

  <rect x="1220" y="600" width="155" height="130" class="box" fill="#fceef0" stroke="#c77e89"/>
  <text x="1297" y="640" text-anchor="middle" class="label">Auditoria</text>
  <text x="1297" y="670" text-anchor="middle" class="tiny">autor · ação</text>
  <text x="1297" y="692" text-anchor="middle" class="tiny">alvo · horário</text>

  <path d="M250 330 H310" class="line"/><text x="280" y="315" text-anchor="middle" class="tiny">uso</text>
  <path d="M520 330 H580" class="line"/><text x="550" y="315" text-anchor="middle" class="tiny">HTTPS</text>
  <path d="M1020 245 H1090" class="line"/>
  <path d="M1020 420 H1090" class="line"/>
  <path d="M790 520 V610" class="line"/><text x="800" y="570" class="tiny">publica tarefas</text>
  <path d="M830 672 H895" class="line"/>
  <path d="M1040 590 V475" class="line dashed"/><text x="1054" y="540" class="tiny">lê/grava</text>
  <path d="M1185 672 H1220" class="line"/>
  <path d="M1020 460 C1060 500 1160 510 1215 600" class="line dashed"/>
  <text x="65" y="785" class="tiny">Docker Compose integra os serviços no desenvolvimento; o protótipo atual continua executável sem Docker.</text>
</svg>
