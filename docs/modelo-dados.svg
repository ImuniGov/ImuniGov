<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Modelo conceitual de dados do ImuniGuia</title>
  <desc id="desc">Diagrama conceitual das entidades de usuários e perfis, dependentes, documentos, extrações OCR, registros vacinais, regras, pendências, decisões, orientações, busca ativa, notificações e auditoria.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#53677b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182433}.title{font-size:29px;font-weight:700}.subtitle{font-size:15px;fill:#526579}.entity{fill:#fff;stroke:#6a88a7;stroke-width:2;rx:12}.auth{fill:#edf4ff;stroke:#7394c3}.clinical{fill:#eaf7f2;stroke:#6b9f88}.process{fill:#fff5e3;stroke:#c69c4d}.support{fill:#f2effb;stroke:#897ab5}.name{font-size:16px;font-weight:700}.fields{font-size:12px;fill:#45596d}.line{stroke:#53677b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.rel{font-size:11px;fill:#4a5d70;font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="920" fill="#f5f8fc"/>
  <text x="55" y="56" class="title">ImuniGuia · modelo conceitual de dados</text>
  <text x="55" y="83" class="subtitle">Cada evidência, decisão, regra e ação deve ser rastreável ao dependente e ao ator autorizado.</text>

  <!-- relationships behind entities -->
  <path d="M205 180 C350 90 450 90 545 160" class="line"/><text x="370" y="110" class="rel">1:N</text>
  <path d="M205 205 C340 270 430 270 545 205" class="line"/><text x="375" y="260" class="rel">1:N</text>
  <path d="M475 180 C500 180 520 180 545 180" class="line"/><text x="500" y="168" class="rel">1:N</text>
  <path d="M690 230 C690 255 690 275 690 300" class="line"/><text x="700" y="270" class="rel">1:N</text>
  <path d="M160 710 V750 H500 V340 H545" class="line"/><text x="290" y="742" class="rel">1:N</text>
  <path d="M835 340 H1000 V450" class="line"/><text x="900" y="330" class="rel">1:N</text>
  <path d="M690 380 V450" class="line"/><text x="700" y="420" class="rel">1:N</text>
  <path d="M835 490 H900" class="line"/><text x="855" y="478" class="rel">1:N</text>
  <path d="M1045 450 C1045 420 1160 410 1200 380" class="line"/><text x="1090" y="420" class="rel">N:1</text>
  <path d="M1190 490 H1245 V610" class="line"/><text x="1200" y="480" class="rel">1:N</text>
  <path d="M1045 530 V630" class="line"/><text x="1055" y="585" class="rel">1:N</text>
  <path d="M835 650 H900" class="line"/><text x="855" y="640" class="rel">1:N</text>
  <path d="M1045 710 C1045 750 900 760 835 820" class="line"/><text x="930" y="753" class="rel">1:N</text>
  <path d="M1045 710 V750 H995 V790" class="line"/><text x="1055" y="750" class="rel">1:N</text>
  <path d="M1090 830 H1110" class="line"/><text x="1090" y="818" class="rel">1:N</text>
  <path d="M205 150 C500 50 1000 50 1245 300" class="line"/><text x="900" y="70" class="rel">1:N</text>
  <path d="M205 140 C700 10 1200 70 1325 790" class="line"/><text x="1280" y="500" class="rel">ator</text>

  <!-- identity -->
  <rect x="55" y="130" width="150" height="100" class="entity auth"/>
  <text x="130" y="158" text-anchor="middle" class="name">USERS</text>
  <text x="70" y="184" class="fields">id · email · senha_hash</text><text x="70" y="204" class="fields">status · created_at</text>
  <rect x="280" y="130" width="195" height="100" class="entity auth"/>
  <text x="377" y="158" text-anchor="middle" class="name">USER_ROLES / ROLES</text>
  <text x="295" y="184" class="fields">user_id · role_id</text><text x="295" y="204" class="fields">família · enfermagem · ACS</text>
  <rect x="545" y="130" width="290" height="100" class="entity auth"/>
  <text x="690" y="158" text-anchor="middle" class="name">DEPENDENT_GUARDIANS</text>
  <text x="560" y="184" class="fields">user_id · dependent_id · vínculo</text><text x="560" y="204" class="fields">autorização do responsável</text>
  <rect x="900" y="130" width="190" height="100" class="entity auth"/>
  <text x="995" y="158" text-anchor="middle" class="name">CONSENTS</text>
  <text x="915" y="184" class="fields">usuário · finalidade</text><text x="915" y="204" class="fields">versão · data</text>

  <!-- evidence and candidate records -->
  <rect x="545" y="300" width="290" height="80" class="entity process"/>
  <text x="690" y="329" text-anchor="middle" class="name">DOCUMENTS</text>
  <text x="560" y="353" class="fields">dependent_id · storage_key · hash · status</text>
  <rect x="545" y="450" width="290" height="80" class="entity process"/>
  <text x="690" y="479" text-anchor="middle" class="name">OCR_JOBS / EXTRACTIONS</text>
  <text x="560" y="503" class="fields">document_id · campos · confiança · erro</text>
  <rect x="900" y="450" width="290" height="80" class="entity clinical"/>
  <text x="1045" y="479" text-anchor="middle" class="name">VACCINATION_RECORDS</text>
  <text x="915" y="503" class="fields">dependente · vacina · dose · data · estado</text>
  <rect x="1110" y="300" width="270" height="80" class="entity clinical"/>
  <text x="1245" y="329" text-anchor="middle" class="name">VACCINES</text>
  <text x="1125" y="353" class="fields">catálogo e identificadores</text>

  <!-- dependent and rule model -->
  <rect x="55" y="610" width="210" height="100" class="entity auth"/>
  <text x="160" y="640" text-anchor="middle" class="name">DEPENDENTS</text>
  <text x="70" y="666" class="fields">id · nome · nascimento</text><text x="70" y="686" class="fields">mínimo de dados necessários</text>
  <rect x="380" y="630" width="95" height="80" class="entity clinical"/>
  <text x="427" y="662" text-anchor="middle" class="name">RULE</text><text x="395" y="687" class="fields">set_id · vacina</text>
  <rect x="545" y="610" width="290" height="100" class="entity clinical"/>
  <text x="690" y="640" text-anchor="middle" class="name">RULE_SETS / CALENDAR_RULES</text>
  <text x="560" y="666" class="fields">versão · vigência · idade · doses · intervalo</text><text x="560" y="686" class="fields">regras rastreáveis e atualizáveis</text>
  <rect x="900" y="630" width="290" height="80" class="entity clinical"/>
  <text x="1045" y="659" text-anchor="middle" class="name">PENDINGS</text>
  <text x="915" y="683" class="fields">dependente · regra/versão · motivo · estado</text>
  <rect x="1110" y="610" width="270" height="80" class="entity process"/>
  <text x="1245" y="639" text-anchor="middle" class="name">REVIEW_DECISIONS</text>
  <text x="1125" y="663" class="fields">registro · autor · data · justificativa</text>

  <!-- care, outreach, notifications, audit -->
  <rect x="545" y="790" width="290" height="80" class="entity process"/>
  <text x="690" y="819" text-anchor="middle" class="name">GUIDANCE</text>
  <text x="560" y="843" class="fields">pendência · UBS · autor · data · visibilidade</text>
  <rect x="900" y="790" width="190" height="80" class="entity support"/>
  <text x="995" y="819" text-anchor="middle" class="name">OUTREACH_CASES</text>
  <text x="915" y="843" class="fields">dependente · pendência · motivo</text>
  <rect x="1110" y="790" width="150" height="80" class="entity support"/>
  <text x="1185" y="819" text-anchor="middle" class="name">ACTIONS</text>
  <text x="1125" y="843" class="fields">ACS · data · contato</text>
  <rect x="1275" y="790" width="105" height="80" class="entity support"/>
  <text x="1327" y="819" text-anchor="middle" class="name">AUDIT</text>
  <text x="1286" y="843" class="fields">ator · evento</text>

  <text x="55" y="900" class="subtitle">Relacionamentos conceituais; OCR sempre cria candidatos “a conferir”, sem confirmar doses automaticamente.</text>
</svg>
