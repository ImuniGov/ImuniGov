services:
  imuniguia:
    image: python:3.12-alpine
    container_name: imuniguia-local
    ports:
      - "4173:4173"
    environment:
      IMUNIGUI_HOST: 0.0.0.0
      IMUNIGUI_PORT: 4173
      IMUNIGUI_DATA_DIR: /data
    volumes:
      - ./:/app:ro
      - imuniguia-data:/data
    working_dir: /app
    command: ["python", "server.py"]
    restart: unless-stopped

volumes:
  imuniguia-data:
