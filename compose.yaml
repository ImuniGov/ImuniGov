services:
  imuniguia:
    build: .
    image: imuniguia:local
    container_name: imuniguia-local
    ports:
      - "4173:4173"
    environment:
      IMUNIGUI_HOST: 0.0.0.0
      IMUNIGUI_PORT: 4173
      IMUNIGUI_DATA_DIR: /data
    volumes:
      - imuniguia-data:/data
    restart: unless-stopped

volumes:
  imuniguia-data:
